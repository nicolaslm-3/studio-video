name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libgl1
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Dépendances
        run: python -m pip install -e ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  whisper:
    # Transcription réelle : modèle « tiny » téléchargé, voix de synthèse, contrôle des mots reconnus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libegl1 libxkbcommon0 libgl1
      - name: Dépendances
        run: python -m pip install -e ".[dev]"
      - name: Voix de test
        run: espeak-ng -v en -s 140 -w speech.wav "Welcome to the video studio. This video shows automatic subtitles for every speaker."
      - name: Transcription réelle
        env:
          QT_QPA_PLATFORM: offscreen
          STUDIOVIDEO_TEST_WHISPER: "1"
          STUDIOVIDEO_TEST_SPEECH: speech.wav
          STUDIOVIDEO_TEST_MODELS: models
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_transcribe_subtitles.py -k real_whisper -rA > pytest.txt 2>&1
          rc=$?
          cat pytest.txt
          if [ $rc -ne 0 ]; then
            # dernières lignes du rapport en annotation (lisible sans ouvrir les journaux)
            msg=$(grep -E "Error|error|assert|Exception|raise|^E " pytest.txt | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Transcription réelle::$msg"
          fi
          exit $rc
      - name: Séparation voix / musique réelle (modèle MDX-Net)
        env:
          QT_QPA_PLATFORM: offscreen
          STUDIOVIDEO_SEP_MODEL: sepmodel/Kim_Vocal_2.onnx
          STUDIOVIDEO_SEP_SPEECH: speech.wav
        shell: bash
        run: |
          mkdir -p sepmodel
          curl -sSfL -o sepmodel/Kim_Vocal_2.onnx https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/Kim_Vocal_2.onnx
          echo "ce74ef3b6a6024ce44211a07be9cf8bc6d87728cc852a68ab34eb8e58cde9c8b  sepmodel/Kim_Vocal_2.onnx" | sha256sum -c
          set +e
          python -m pytest -q -s tests/test_separation.py -rA > sep.txt 2>&1
          rc=$?
          cat sep.txt
          r=$(grep -o '{"sdr_before.*}' sep.txt | head -1)
          [ -n "$r" ] && echo "::notice title=Séparation réelle::$r"
          if grep -q "SKIPPED" sep.txt; then echo "::error title=Séparation réelle::test réel ignoré"; rc=1; fi
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "Error|error|assert|Exception|^E " sep.txt | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Séparation réelle::$msg"
          fi
          exit $rc
      - name: Identification réelle des intervenants (modèle WeSpeaker)
        env:
          QT_QPA_PLATFORM: offscreen
          STUDIOVIDEO_SPK_MODEL: spkmodel/wespeaker_en_voxceleb_resnet34.onnx
        shell: bash
        run: |
          mkdir -p spkmodel
          curl -sSfL -o spkmodel/wespeaker_en_voxceleb_resnet34.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx
          echo "5ef208a9da1453335308a6b6f4e6dfbd7e183a38b604de0a57664f45d257fe94  spkmodel/wespeaker_en_voxceleb_resnet34.onnx" | sha256sum -c
          set +e
          python -m pytest -q tests/test_diarize.py -rA > spk.txt 2>&1
          rc=$?
          cat spk.txt
          if grep -q "SKIPPED" spk.txt; then echo "::error title=Intervenants::test réel ignoré"; rc=1; fi
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "Error|error|assert|Exception|^E " spk.txt | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Intervenants::$msg"
          fi
          exit $rc
      - name: Voix hors ligne réelle (Piper + voix officielle, vérifiée par Whisper)
        env:
          QT_QPA_PLATFORM: offscreen
          STUDIOVIDEO_PIPER_EXE: piperbin/piper/piper
          STUDIOVIDEO_PIPER_VOICE: pipervoice/fr_FR-siwis-medium.onnx
          STUDIOVIDEO_TEST_MODELS: models
        shell: bash
        run: |
          mkdir -p piperbin pipervoice
          curl -sSfL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz -C piperbin
          V=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          curl -sSfL -o pipervoice/fr_FR-siwis-medium.onnx $V/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx
          curl -sSfL -o pipervoice/fr_FR-siwis-medium.onnx.json $V/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx.json
          curl -sSfL -o pipervoice/voices.json $V/voices.json
          python - <<'PY'
          import json, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from studiovideo.ai import piper
          m = Path("catmodels"); (m / "piper").mkdir(parents=True, exist_ok=True)
          shutil.copy("pipervoice/voices.json", m / "piper" / "voices.json")
          cat = piper.catalog(m)
          fr = [v for v in cat if v.family == "fr"]
          assert len(cat) > 50 and any(v.key == "fr_FR-siwis-medium" for v in fr), (len(cat), [v.key for v in fr])
          print(f"::notice title=Catalogue Piper::{len(cat)} voix, dont {len(fr)} en français")
          PY
          set +e
          python -m pytest -q -s tests/test_piper.py -rA > piper.txt 2>&1
          rc=$?
          cat piper.txt
          t=$(grep -o '{"piper_transcription.*}' piper.txt | head -1)
          [ -n "$t" ] && echo "::notice title=Piper réel::$t"
          if grep -q "SKIPPED" piper.txt; then echo "::error title=Piper réel::test réel ignoré"; rc=1; fi
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "Error|error|assert|Exception|^E " piper.txt | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Piper réel::$msg"
          fi
          exit $rc
