# Compilation et publication d'une version.
# Déclenchement :
#   - automatiquement quand __version__ change sur main (src/studiovideo/__init__.py) ;
#   - ou en poussant un tag vX.Y.Z (stable) / vX.Y.Z-beta.N (canal bêta) ;
#   - ou à la main depuis l'onglet Actions (« Run workflow »).
# Si la release de cette version existe déjà avec son installateur, rien n'est refait.
#
# Secrets requis :
#   UPDATE_PRIVATE_KEY   clé privée ed25519 (tools/update_keys.py generate)
# Secrets facultatifs (signature Authenticode, évite l'avertissement SmartScreen) :
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD
#
# Résultat :
#   - GitHub Release avec l'installateur signé et une version portable (.zip) ;
#   - appcast.xml (stable) ou appcast-beta.xml mis à jour sur la branche gh-pages (GitHub Pages).
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["src/studiovideo/__init__.py"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  FFMPEG_ZIP: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
  WINSPARKLE_VERSION: "0.9.4"

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Contexte de version
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/studiovideo/__init__.py)"
          fi
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then CHANNEL=beta; FEED=appcast-beta.xml; else CHANNEL=stable; FEED=appcast.xml; fi
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY##*/}"
          SKIP=false
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -q "Setup.exe"; then SKIP=true; fi
          echo "Version $VERSION ($CHANNEL), déjà publiée : $SKIP"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "feed=$FEED" >> $GITHUB_OUTPUT
          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          echo "base_url=https://${OWNER,,}.github.io/${REPO}" >> $GITHUB_OUTPUT

      - name: Vérification de la clé de signature
        if: steps.ctx.outputs.skip != 'true'
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_PRIVATE_KEY" ]; then
            echo "::error::Le secret UPDATE_PRIVATE_KEY est absent : une version publiée sans lui ne pourrait jamais se mettre à jour. Ajoutez-le dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.ctx.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        if: steps.ctx.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          choco install ffmpeg -y --no-progress

      - name: Tests
        if: steps.ctx.outputs.skip != 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE --tb=short > pytest.txt 2>&1
          rc=$?
          cat pytest.txt
          grep -E "^(FAILED|ERROR) " pytest.txt | head -20 | while read -r line; do
            echo "::error title=Test::$(echo "$line" | cut -c1-900 | sed 's/%/%25/g')"
          done
          exit $rc

      - name: Injection de la version et de la clé publique
        if: steps.ctx.outputs.skip != 'true'
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: python tools/stamp_build.py --tag "${{ steps.ctx.outputs.tag }}" --base-url "${{ steps.ctx.outputs.base_url }}"

      - name: FFmpeg et WinSparkle à embarquer
        if: steps.ctx.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force vendor/ffmpeg, vendor/winsparkle, tmp | Out-Null
          Invoke-WebRequest $env:FFMPEG_ZIP -OutFile tmp/ffmpeg.zip
          Expand-Archive tmp/ffmpeg.zip tmp/ffmpeg
          Get-ChildItem tmp/ffmpeg -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination vendor/ffmpeg
          Get-ChildItem tmp/ffmpeg -Recurse -Include LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination vendor/ffmpeg/LICENSE.txt
          if (-not (Test-Path vendor/ffmpeg/ffmpeg.exe) -or -not (Test-Path vendor/ffmpeg/ffprobe.exe)) { throw "FFmpeg introuvable dans l'archive" }
          $v = $env:WINSPARKLE_VERSION
          Invoke-WebRequest "https://github.com/vslavik/winsparkle/releases/download/v$v/WinSparkle-$v.zip" -OutFile tmp/winsparkle.zip
          Expand-Archive tmp/winsparkle.zip tmp/winsparkle
          $dll = Get-ChildItem tmp/winsparkle -Recurse -Filter WinSparkle.dll | Where-Object { $_.FullName -match '\\x64\\Release\\' -and $_.FullName -notmatch '__MACOSX' } | Select-Object -First 1
          if (-not $dll) { throw "WinSparkle.dll x64 introuvable" }
          Copy-Item $dll.FullName vendor/winsparkle/WinSparkle.dll

      - name: PyInstaller
        if: steps.ctx.outputs.skip != 'true'
        run: pyinstaller packaging/studiovideo.spec --noconfirm --clean

      - name: Auto-test de l'exécutable (transcription réelle et export sous-titré)
        if: steps.ctx.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force selftest | Out-Null
          python -c "import sys; sys.path.insert(0,'src'); from pathlib import Path; from studiovideo.transcribe import engines; engines.download_model(Path('selftest/models'), 'tiny', lambda f,m: None, lambda: False)"
          if ($LASTEXITCODE -ne 0) { echo "::error title=Auto-test::téléchargement du modèle tiny impossible"; throw "modèle" }
          New-Item -ItemType Directory -Force selftest\models\separation | Out-Null
          Invoke-WebRequest -Uri "https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/Kim_Vocal_2.onnx" -OutFile selftest\models\separation\Kim_Vocal_2.onnx
          if ((Get-FileHash selftest\models\separation\Kim_Vocal_2.onnx -Algorithm SHA256).Hash -ne "CE74EF3B6A6024CE44211A07BE9CF8BC6D87728CC852A68AB34EB8E58CDE9C8B") { echo "::error title=Auto-test::modèle de séparation corrompu"; throw "modèle" }
          New-Item -ItemType Directory -Force selftest\piper | Out-Null
          Invoke-WebRequest -Uri "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip" -OutFile selftest\piper.zip
          Expand-Archive selftest\piper.zip -DestinationPath selftest\piper -Force
          $hf = "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/fr/fr_FR/siwis/medium/fr_FR-siwis-medium.onnx"
          Invoke-WebRequest -Uri $hf -OutFile selftest\piper\fr_FR-siwis-medium.onnx
          Invoke-WebRequest -Uri "$hf.json" -OutFile selftest\piper\fr_FR-siwis-medium.onnx.json
          Get-ChildItem -Recurse selftest\models | Select-Object FullName, Length | Format-Table -AutoSize
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.Rate = -1
          $tts.SetOutputToWaveFile("$PWD\selftest\speech.wav")
          $tts.Speak("Welcome to the video studio. This video shows automatic subtitles for every speaker.")
          $tts.Dispose()
          $p = Start-Process -FilePath "dist\StudioVideo\StudioVideo.exe" -ArgumentList "--self-test", "$PWD\selftest\report.json", "--models", "$PWD\selftest\models", "--speech", "$PWD\selftest\speech.wav", "--piper", "$PWD\selftest\piper" -Wait -PassThru
          if (-not (Test-Path selftest\report.json)) { echo "::error title=Auto-test::aucun rapport produit (code $($p.ExitCode))"; throw "pas de rapport" }
          Get-Content selftest\report.json
          if ($p.ExitCode -ne 0) {
            $rep = Get-Content selftest\report.json -Raw | ConvertFrom-Json
            foreach ($c in $rep.checks.PSObject.Properties) {
              if (-not $c.Value.ok) {
                $t = (($c.Value.error + "`n" + $c.Value.trace) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')
                echo "::error title=Auto-test $($c.Name)::$t"
              }
            }
            throw "L'auto-test de l'exécutable a échoué (code $($p.ExitCode))."
          }
          $r = Get-Content selftest\report.json | ConvertFrom-Json
          $txt = $r.checks.asr_transcription.detail.text.ToLower()
          if (-not ($txt -match "video|studio|subtitle")) { throw "Transcription inattendue : $txt" }
          echo "::notice::Auto-test OK — transcription : $txt"
          $sep = $r.checks.separation.detail
          if (-not $sep.sdr_after) { throw "Séparation non testée : $sep" }
          echo "::notice::Auto-test OK — séparation voix : $($sep.sdr_before) → $($sep.sdr_after) dB en $($sep.seconds) s"
          $pv = $r.checks.piper_voice.detail
          if (-not $pv.heard) { throw "Voix hors ligne non vérifiée : $pv" }
          echo "::notice::Auto-test OK — voix hors ligne (Piper) entendue par Whisper : $($pv.heard)"
          echo "::notice::Auto-test OK — PDF et création originale : $($r.checks.pdf_original.detail.scenes) scène(s), $($r.checks.pdf_original.detail.duration) s"

      - name: Signature Authenticode (facultative)
        if: steps.ctx.outputs.skip != 'true' && env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/StudioVideo/StudioVideo.exe
          echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Installateur Inno Setup
        if: steps.ctx.outputs.skip != 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec de Inno Setup" }

      - name: Signature Authenticode de l'installateur (facultative)
        if: steps.ctx.outputs.skip != 'true' && env.HAS_CERT == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/StudioVideo-${{ steps.ctx.outputs.version }}-Setup.exe"
          Remove-Item cert.pfx

      - name: Version portable
        if: steps.ctx.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item dist/StudioVideo/portable.txt -Value "Version portable : les données restent dans %LOCALAPPDATA%\StudioVideo. Pas de mise à jour automatique." | Out-Null
          Compress-Archive dist/StudioVideo/* "dist/StudioVideo-${{ steps.ctx.outputs.version }}-portable.zip"

      - name: Empreintes SHA-256
        if: steps.ctx.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Liste figée AVANT d'écrire le fichier (sinon il est lu pendant son écriture).
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" })
          $lines = foreach ($f in $files) { "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)" }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publication GitHub Release
        if: steps.ctx.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ctx.outputs.version }}"
          NOTES="docs/releases/${V}.md"
          [ -f "$NOTES" ] || echo "Version ${V}" > "$NOTES"
          PRE=""; [ "${{ steps.ctx.outputs.channel }}" = "beta" ] && PRE="--prerelease"
          ASSETS=("dist/StudioVideo-${V}-Setup.exe" "dist/StudioVideo-${V}-portable.zip" dist/SHA256SUMS.txt)
          # La release peut déjà exister si elle a été créée depuis le site GitHub.
          TAG="${{ steps.ctx.outputs.tag }}"
          # jusqu'à 4 tentatives : les envois de gros fichiers vers GitHub échouent parfois sans raison
          ls -la dist/
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              out=$(gh release upload "$TAG" "${ASSETS[@]}" --clobber 2>&1) && exit 0
            else
              out=$(gh release create "$TAG" --target "${GITHUB_SHA}" $PRE --title "Studio Vidéo ${V}" --notes-file "$NOTES" "${ASSETS[@]}" 2>&1) && exit 0
            fi
            echo "$out"
            echo "::warning title=Publication (tentative ${attempt})::$(echo "$out" | tail -5 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            sleep $((attempt * 20))
          done
          echo "::error title=Publication::la release ${TAG} n'a pas pu être publiée sur GitHub"
          exit 1

      - name: Mise à jour du flux appcast (gh-pages)
        if: steps.ctx.outputs.skip != 'true'
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          V="${{ steps.ctx.outputs.version }}"
          FEED="${{ steps.ctx.outputs.feed }}"
          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add site origin/gh-pages
          else
            git worktree add --detach site && (cd site && git checkout --orphan gh-pages && git rm -rf . -q || true)
          fi
          python tools/make_appcast.py --feed "site/${FEED}" --version "$V" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ctx.outputs.tag }}/StudioVideo-${V}-Setup.exe" \
            --installer "dist/StudioVideo-${V}-Setup.exe" --notes "docs/releases/${V}.md"
          cd site
          touch .nojekyll
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Flux de mise à jour : ${V} (${FEED})"
          git push origin HEAD:gh-pages
