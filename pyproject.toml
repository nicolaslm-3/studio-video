[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiovideo"
dynamic = ["version"]
description = "Studio de production et de distribution audiovisuelle assisté par IA"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "keyring>=25",
    "faster-whisper>=1.1",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "cryptography>=42", "pyinstaller>=6.6"]
download = ["yt-dlp"]

[project.scripts]
studiovideo = "studiovideo.app:main"

[tool.setuptools.dynamic]
version = {attr = "studiovideo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studiovideo = ["db/migrations/*.sql", "ui/assets/*", "ui/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
